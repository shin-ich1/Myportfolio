name: Admin shared-navigation regression

on:
  pull_request:
    paths:
      - "admin/js/**"
      - "admin/pages/**"
      - "admin/dashboard.html"
      - "tests/**"
      - "telemetry-worker/src/**"
      - "telemetry-worker/wrangler.jsonc"
      - "scripts/check-staging-worker-health.mjs"
      - "scripts/prepare-staging.mjs"
      - "scripts/staging-targets.json"
      - "storage-bridge-url.js"
      - "package.json"
      - ".github/workflows/admin-performance-regression.yml"
  push:
    branches:
      - "perf/admin-workspace-investigation-20261008"
    paths:
      - "admin/js/**"
      - "admin/pages/**"
      - "admin/dashboard.html"
      - "tests/**"
      - "telemetry-worker/src/**"
      - "telemetry-worker/wrangler.jsonc"
      - "scripts/check-staging-worker-health.mjs"
      - "scripts/prepare-staging.mjs"
      - "scripts/staging-targets.json"
      - ".github/workflows/admin-performance-regression.yml"

permissions:
  contents: read

jobs:
  shared-admin-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check admin/js/admin-shell.js
          node --check admin/js/workspace-host.js
          node --check admin/js/admin-ui.js
          node --check admin/js/home.js
          node --check scripts/prepare-staging.mjs
          node --check scripts/check-staging-worker-health.mjs
          node --check storage-bridge-url.js
          node --check telemetry-worker/src/index.js
          node --check telemetry-worker/src/security-coordinator.js
      - name: Run shared-navigation and staging isolation tests
        run: node --test tests/admin-shared-navigation-performance.test.mjs tests/admin-workspace-security-gate.test.mjs tests/admin-home-startup-requests.test.mjs tests/admin-pending-navigation-lifecycle.test.mjs tests/staging-build-isolation.test.mjs tests/staging-worker-authorization.test.mjs tests/staging-worker-health-gate.test.mjs tests/security-coordinator-atomicity.test.mjs tests/security-recovery-atomicity.test.mjs tests/security-first-device-bootstrap.test.mjs tests/public-message-atomicity.test.mjs tests/google-drive-oauth-state-replay.test.mjs
      - name: Verify staging manifest has no hardcoded API key
        run: node -e "if (Object.hasOwn(require('./scripts/staging-targets.json').firebase, 'apiKey')) process.exit(1)"

      - name: Bundle isolated staging Worker without deployment
        run: |
          npm ci --prefix telemetry-worker --no-audit --no-fund
          export LAN_STAGING_FIREBASE_WEB_API_KEY="$(node -e "process.stdout.write('AIza'+'A'.repeat(35))")"
          node scripts/prepare-staging.mjs
          cd telemetry-worker
          ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.staging.jsonc --outdir ../.lan-staging/worker-bundle
          cd ..
          node --test telemetry-worker/tests/atomic-do-runtime.test.mjs
