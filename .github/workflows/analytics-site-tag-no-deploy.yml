name: Analytics site-tag regression (NO DEPLOY)
on:
  push:
    branches:
      - fix/analytics-site-tag-20261106
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Entire repository regression suite
        run: node --test tests/*.test.mjs
      - name: Worker syntax checks
        run: |
          node --check telemetry-worker/src/index.js
          node --check telemetry-worker/src/security-coordinator.js
          node --check web-analytics-beacon.js
      - name: Install pinned Worker dependencies
        run: npm ci --prefix telemetry-worker --no-audit --no-fund
      - name: Production Worker dry-run (no deployment)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          cd telemetry-worker
          npx --no-install wrangler deploy --dry-run --outdir /tmp/lan-analytics-site-tag-dry-run
