name: Firestore disaster-recovery forward-repair security gate (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'scripts/secure-firestore-backup.mjs'
      - 'scripts/security-dr-restore-policy.mjs'
      - 'tests/secure-firestore-backup.test.mjs'
      - '.github/workflows/dr-forward-recovery-ci.yml'
      - 'docs/production-dr-continuity-20261015.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-recovery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check isolated DR owners
        run: |
          node --check scripts/secure-firestore-backup.mjs
          node --check scripts/security-dr-restore-policy.mjs
          node --check tests/secure-firestore-backup.test.mjs
      - name: Reject unauthenticated security-state restore and cloud mutation
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const policy=readFileSync('scripts/security-dr-restore-policy.mjs','utf8');
          const backup=readFileSync('scripts/secure-firestore-backup.mjs','utf8');
          assert.match(policy,/freshIdentityAndMfaRequired:\s*true/);
          assert.match(policy,/noOldSecurityStateReactivated:\s*true/);
          assert.match(policy,/writeOperations:\s*0/);
          assert.match(backup,/decipher\.final\(\)/);
          assert.match(backup,/recoveryScan\.finish\(true, actual\)/);
          assert.doesNotMatch(policy,/https?:\/\/|fetch\(|execFile|writeFile|setCustomUserClaims|setDoc\(/);
          console.log('PASS: no live restore/write path; archive verification required.');
          NODE
      - name: Synthetic encrypted archive replay-safe recovery regression
        run: node --test tests/secure-firestore-backup.test.mjs
