name: LIVE release candidate Public Message regression (NO DEPLOY)
on:
  push:
    branches:
      - release/live-public-message-parity-20261101
permissions:
  contents: read
jobs:
  message-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: LIVE release regression
        run: node --test tests/live-message-release-regression.test.mjs
      - name: Available repository tests
        shell: bash
        run: |
          mapfile -t cases < <(find tests -maxdepth 1 -name '*.test.mjs' \
            ! -name 'firestore-backup-restore-emulator.test.mjs' \
            ! -name 'firestore-security-emulator.test.mjs' | sort)
          node --test "${cases[@]}"
      - name: Production Worker bundle DRY RUN ONLY — no credentials or deployment
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes --package=wrangler@4.156.0 wrangler deploy --dry-run \
            --config telemetry-worker/wrangler.jsonc \
            --outdir /tmp/lan-live-message-worker-dry-run
      - name: JS syntax
        run: |
          node --check app.js
          node --check message-service.js
          node --check telemetry-worker/src/index.js
          node --check telemetry-worker/src/security-coordinator.js
      - name: Assemble tracked source and audit report (NO DEPLOY)
        run: |
          mkdir -p "$RUNNER_TEMP/lan-live-message-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/lan-live-message-source"
          test -f "$RUNNER_TEMP/lan-live-message-source/release-reports/live-public-message-release-candidate-20261101.md"
          test -f "$RUNNER_TEMP/lan-live-message-source/tests/live-message-release-regression.test.mjs"
      - name: Publish one consolidated candidate source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LAN-LIVE-Public-Message-RELEASE-CANDIDATE-20261101
          path: ${{ runner.temp }}/lan-live-message-source/
          include-hidden-files: true
          retention-days: 30
