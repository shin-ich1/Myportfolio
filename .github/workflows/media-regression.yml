name: Isolated media compatibility regression tests

on:
  push:
    branches:
      - fix/media-compatibility-canonical-20261022
      - fix/public-mobile-media-cold-load-20261025
      - fix/public-photo-media-visible-loading-20261025
      - fix/public-shared-media-priority-20261025
      - fix/public-static-renditions-startup-20261025
      - fix/public-message-browser-warmup-resize-main-20261103
      - release/combined-storage-puzzle-candidate-20261103

permissions:
  contents: read

jobs:
  media-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete repository test suite
        run: node --test tests/*.test.mjs
      - name: Syntax-check changed JavaScript modules
        run: |
          node --check app.js
          node --check storage-asset.js
          node --check video-compatibility.js
          node --check admin/services/storageUploadService.js
          node --check admin/js/settings.js
          node --check telemetry-worker/src/index.js
          node --check scripts/prepare-browser-video.mjs
          node --check scripts/prepare-static-videos.mjs
      - name: Audit diff and archive isolated source (NO DEPLOY)
        shell: bash
        run: |
          set -euo pipefail
          base=4ca4fcfedc7959335d78517702638c1dda51f6f4
          git diff --check "$base" HEAD
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/media-regression.yml|admin/js/settings.js|app.js|tests/storage-drive-connection-state.test.mjs|tests/public-message-browser-warmup-resize.test.mjs|tests/public-message-expired-puzzle-recovery.test.mjs|tests/public-message-image-failure-retry-ui.test.mjs|release-reports/combined-storage-puzzle-20261103.md) ;;
              *) echo "Unexpected candidate file: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          if git ls-files | grep -E '(^|/)(\.env|\.dev\.vars|\.private-key|service-account\.json) -o "$RUNNER_TEMP/LAN-Combined-Storage-Puzzle-20261103-CANDIDATE.zip"
          unzip -t "$RUNNER_TEMP/LAN-Combined-Storage-Puzzle-20261103-CANDIDATE.zip" >/dev/null
      - name: Retain one isolated source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Combined-Storage-Puzzle-20261103-CANDIDATE
          path: ${{ runner.temp }}/LAN-Combined-Storage-Puzzle-20261103-CANDIDATE.zip
          retention-days: 30
; then
            echo "Sensitive filename tracked: release blocked"; exit 1
          fi
          git archive --format=zip HEAD -o "$RUNNER_TEMP/LAN-Combined-Storage-Puzzle-20261103-CANDIDATE.zip"
          unzip -t "$RUNNER_TEMP/LAN-Combined-Storage-Puzzle-20261103-CANDIDATE.zip" >/dev/null
      - name: Retain one isolated source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Combined-Storage-Puzzle-20261103-CANDIDATE
          path: ${{ runner.temp }}/LAN-Combined-Storage-Puzzle-20261103-CANDIDATE.zip
          retention-days: 30
