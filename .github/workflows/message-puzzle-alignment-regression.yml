name: Public Message puzzle alignment security regression (isolated)

on:
  push:
    branches:
      - fix/message-puzzle-tight-alignment-20261101

permissions:
  contents: read

jobs:
  puzzle-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Puzzle alignment regression (real SQLite coordinator logic, fake in-memory storage)
        run: node --test tests/message-puzzle-alignment-security.test.mjs
      - name: Existing non-emulator Node regression suite
        run: node --test tests/*.test.mjs
      - name: Syntax checks
        run: |
          node --check telemetry-worker/src/index.js
          node --check telemetry-worker/src/security-coordinator.js
          node --check tests/message-puzzle-alignment-security.test.mjs
