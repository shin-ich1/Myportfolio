name: PR11 isolated staging Hosting verification

on:
  push:
    branches:
      - staging/pr11-turnstile-mobile-20261011
    paths:
      - .github/workflows/pr11-staging-hosting-verification.yml

permissions:
  contents: read

jobs:
  verify-public-fix:
    name: Test exact PR11 staging content (no deployment)
    if: >-
      ${{ github.repository == 'shin-ich1/Myportfolio' &&
          github.ref == 'refs/heads/staging/pr11-turnstile-mobile-20261011' &&
          github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging ancestry, exact changes and reviewed Public assets
        shell: bash
        run: |
          set -euo pipefail
          BASE=0f4762f2ca6654d7440a2d201659a8159113f2f3
          git merge-base --is-ancestor "$BASE" HEAD
          actual="$(git diff --name-only "$BASE" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/pr11-staging-hosting-verification.yml' 'app.js' 'tests/public-turnstile-mobile-regression.test.mjs' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test "$(git hash-object app.js)" = '36e3309406322038d353d7f74ac739ffb8b73ec0'
          test "$(git hash-object tests/public-turnstile-mobile-regression.test.mjs)" = 'a94902f3d54c2ecd89b61a632f563d9b6af35577'
          test "$(git show "$BASE":telemetry-worker/src/index.js | git hash-object --stdin)" = "$(git hash-object telemetry-worker/src/index.js)"
          test "$(git show "$BASE":firestore.rules | git hash-object --stdin)" = "$(git hash-object firestore.rules)"
          echo 'Exact reviewed Public fix and unchanged Worker/Firestore security owners confirmed.'
      # The PR10 release-candidate frozen-Public blob test deliberately expects app.js
      # to remain byte-identical to main. It belongs to PR10, not the user-approved
      # PR11 staging-only Public bug fix. Keep it unchanged; the preceding exact
      # diff/blob gate rejects EVERY modification outside the 2 approved files.
      - name: Verify syntax and focused security, Public and staging regressions
        run: |
          set -euo pipefail
          node --check app.js
          node --check scripts/prepare-staging.mjs
          node --test tests/public-turnstile-mobile-regression.test.mjs tests/public-message-atomicity.test.mjs tests/staging-build-isolation.test.mjs tests/staging-worker-authorization.test.mjs tests/production-cutover-preflight.test.mjs

  deploy-staging-hosting-only:
    name: Deploy approved staging Hosting only (no Worker or Firestore)
    needs: verify-public-fix
    if: >-
      ${{ github.repository == 'shin-ich1/Myportfolio' &&
          github.ref == 'refs/heads/staging/pr11-turnstile-mobile-20261011' &&
          github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: lan-security-staging
    permissions:
      contents: read
      id-token: write
    env:
      LAN_STAGING_FIREBASE_WEB_API_KEY: ${{ secrets.LAN_STAGING_FIREBASE_WEB_API_KEY }}
      LAN_STAGING_WIF_PROVIDER: ${{ vars.LAN_STAGING_WIF_PROVIDER }}
      LAN_STAGING_DEPLOY_SERVICE_ACCOUNT: ${{ vars.LAN_STAGING_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact staging identity and target before requesting credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'shin-ich1/Myportfolio'
          test "$GITHUB_REF" = 'refs/heads/staging/pr11-turnstile-mobile-20261011'
          test "$GITHUB_EVENT_NAME" = 'push'
          node --input-type=module <<'NODE'
          const required = ['LAN_STAGING_WIF_PROVIDER', 'LAN_STAGING_DEPLOY_SERVICE_ACCOUNT', 'LAN_STAGING_FIREBASE_WEB_API_KEY'];
          for (const name of required) if (!process.env[name]) throw Error('Required staging configuration missing: ' + name);
          if (!/^projects\/571587695468\/locations\/global\/workloadIdentityPools\/[a-z][a-z0-9-]{3,31}\/providers\/[a-z][a-z0-9-]{3,31}$/.test(process.env.LAN_STAGING_WIF_PROVIDER))
            throw Error('Invalid staging Workload Identity Provider.');
          if (!/^[a-z][a-z0-9-]*@lan-portfolio-staging\.iam\.gserviceaccount\.com$/.test(process.env.LAN_STAGING_DEPLOY_SERVICE_ACCOUNT))
            throw Error('Expected a staging-project deploy identity.');
          if (!/^AIza[A-Za-z0-9_-]{30,}$/.test(process.env.LAN_STAGING_FIREBASE_WEB_API_KEY))
            throw Error('Invalid staging Firebase web API key format.');
          NODE
      - name: Build isolated staging Hosting using existing canonical builder
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-staging.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const cfg = JSON.parse(readFileSync('.lan-staging/.firebaserc','utf8'));
          const hosting = JSON.parse(readFileSync('.lan-staging/firebase.json','utf8')).hosting;
          const publicSource = readFileSync('.lan-staging/site/app.js','utf8');
          const publicConfig = readFileSync('.lan-staging/site/config.js','utf8');
          if (cfg.projects.default !== 'lan-portfolio-staging' || hosting.public !== 'site') throw Error('Unexpected Hosting destination.');
          if (!publicConfig.includes('lan-portfolio-staging') || publicConfig.includes('rolando-portfolio-3f1a3')) throw Error('Production Firebase reference in staged config.');
          if (!publicSource.includes('slot.parentElement.getBoundingClientRect().width < 300')) throw Error('PR11 widget fix missing.');
          if (!publicSource.includes('slider.onchange = async () =>')) throw Error('Original sliding puzzle not preserved.');
          if (publicSource.includes('TURNSTILE_SECRET_KEY')) throw Error('Turnstile secret reference found in public source.');
          console.log('Isolated staging Public Hosting build verified; no production target.');
          NODE
      - name: Get short-lived staging Firebase credentials using GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: lan-portfolio-staging
          workload_identity_provider: ${{ vars.LAN_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.LAN_STAGING_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify active staging Firebase project
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project)" = 'lan-portfolio-staging'
          gcloud auth print-access-token >/dev/null
      - name: Deploy only Firebase Hosting to staging project
        working-directory: .lan-staging
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.20.0 deploy --only hosting --project lan-portfolio-staging --non-interactive
      - name: Deployment declaration
        run: |
          echo 'Only lan-portfolio-staging Firebase Hosting was deployed.'
          echo 'Cloudflare Workers, Firestore Rules, and production remain untouched.'
