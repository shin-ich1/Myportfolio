name: Prepare Public static images (isolated branch only)

on:
  push:
    branches:
      - fix/public-static-renditions-startup-20261025
    paths:
      - .github/workflows/prepare-public-static-images.yml
      - scripts/prepare-static-images.mjs
      - static-image-renditions.js
      - assets/images/**

permissions:
  contents: write

concurrency:
  group: isolated-static-images-20261025
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/public-static-renditions-startup-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline image conversion binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp ffmpeg
          cwebp -version
      - name: Generate verified, allowlisted static renditions
        run: node scripts/prepare-static-images.mjs
      - name: Verify all existing and new regression tests
        run: |
          node --test tests/*.test.mjs
          node --check app.js
          node --check static-image-renditions.js
          node --check scripts/prepare-static-images.mjs
      - name: Commit derived assets only to this isolated fix branch
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/fix/public-static-renditions-startup-20261025"
          git add -- assets/images static-image-renditions.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(public): add measured WebP renditions and exact static allowlist"
            git push origin HEAD:refs/heads/fix/public-static-renditions-startup-20261025
          else
            echo "Renditions already current; no binary or manifest changes."
          fi
