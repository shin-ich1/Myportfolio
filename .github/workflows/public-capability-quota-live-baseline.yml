name: Public capability quota — live baseline regression
on:
  push:
    branches:
      - release/public-capability-quota-live-baseline-20261013
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  public-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Public script syntax
        run: node --check app.js
      - name: Parse guarded release PowerShell without running it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/deploy-production-public-quota-one-file.ps1', [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { $parseErrors | Format-List; exit 1 }
      - name: Verify frozen live Public baseline and quota regression
        run: node --test tests/public-quota-live-baseline-freeze.test.mjs tests/public-capability-read-budget.test.mjs tests/production-one-file-public-quota-release.test.mjs
