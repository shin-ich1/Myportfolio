name: Public Messaging On-Demand Firebase — NO DEPLOY

on:
  push:
    branches: [perf/defer-public-message-firebase-20261112]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: On-demand messaging regression
        run: node --test tests/public-messaging-demand-load.test.mjs
      - name: Full Public/Admin/security regression suite
        run: node --test tests/*.test.mjs
      - name: Syntax checks
        run: |
          node --check app.js
          node --check message-service.js
          node --check message-visitor-service.js
          node --check tests/public-messaging-demand-load.test.mjs
      - name: Strict changed-file audit
        shell: bash
        run: |
          git diff --name-only cacc5ef931e77f9fd0d8d71f5fd369adeaa442dc..HEAD
          if git diff --name-only cacc5ef931e77f9fd0d8d71f5fd369adeaa442dc..HEAD | grep -Ev '^(app\.js|message-service\.js|message-visitor-service\.js|tests/public-messaging-demand-load\.test\.mjs|tests/live-message-release-regression\.test\.mjs|\.github/workflows/public-messaging-on-demand-no-deploy\.yml|release-reports/public-messaging-demand-load-20261112\.md)$'; then
            echo 'Unexpected source, configuration, Worker, Admin, CSS or security changes.' >&2
            exit 1
          fi
      - name: Package consolidated source ZIP only after verified tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lan-messaging-candidate"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/lan-messaging-candidate"
          (cd "$RUNNER_TEMP/lan-messaging-candidate" && zip -q -r "$RUNNER_TEMP/LAN-MESSAGING-ON-DEMAND-CANDIDATE.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-Messaging-On-Demand-Candidate
          path: ${{ runner.temp }}/LAN-MESSAGING-ON-DEMAND-CANDIDATE.zip
          if-no-files-found: error
          retention-days: 14
