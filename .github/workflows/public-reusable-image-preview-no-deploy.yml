name: Portfolio source + media regression (NO DEPLOY)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Full application tests
        run: node --test tests/*.test.mjs

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check record-media.js
          node --check scripts/audit-repository-security.mjs
          node --check scripts/check-analytics-config.mjs
          node --check scripts/prepare-hosting-candidate.mjs

      - name: Browser smoke - desktop, tablet, phone and landscape
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/lan-preview-browser" --no-audit --no-fund playwright-core@1.56.1
          LAN_PLAYWRIGHT_CORE="$RUNNER_TEMP/lan-preview-browser/node_modules/playwright-core" node scripts/public-image-preview-browser-smoke.mjs

      - name: Tracked secret filename and high-confidence signature audit
        run: node scripts/audit-repository-security.mjs

      - name: Firebase publish-directory candidate (read-only)
        run: node scripts/prepare-hosting-candidate.mjs --check

      - name: Cloudflare Analytics site-tag consistency (read-only)
        run: node scripts/check-analytics-config.mjs

      - name: Diff whitespace audit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF"...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Confirm no deployment in this workflow
        run: echo "Source verification only; Firebase and Cloudflare LIVE are unchanged."
