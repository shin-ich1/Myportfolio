name: Isolated staging puzzle fast retry and countdown UI
on:
  push:
    branches:
      - fix/staging-puzzle-fast-retry-countdown-ui-20261101
permissions:
  contents: read
jobs:
  puzzle-retry-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast wrong answer and server countdown UX regression
        run: node --test tests/public-message-fast-retry-cooldown.test.mjs
      - name: Existing available non-emulator repository tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -name '*.test.mjs' \
            ! -name 'firestore-backup-restore-emulator.test.mjs' \
            ! -name 'firestore-security-emulator.test.mjs' | sort)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"
      - name: Report unrun emulator-only suites (not waived)
        run: |
          echo 'NOT RUN: firestore-backup-restore-emulator.test.mjs'
          echo 'NOT RUN: firestore-security-emulator.test.mjs'
          echo 'These require separately provisioned isolated Firestore emulator.'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check message-service.js
          node --check tests/public-message-fast-retry-cooldown.test.mjs
