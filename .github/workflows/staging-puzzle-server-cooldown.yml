name: Isolated staging puzzle wrong-answer cooldown
on:
  push:
    branches:
      - fix/staging-puzzle-server-cooldown-20261101
permissions:
  contents: read
jobs:
  secure-cooldown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server-issued wrong-answer cooldown security regression
        run: node --test tests/message-puzzle-wrong-answer-cooldown.test.mjs
      - name: Available non-emulator repository tests
        run: node --test tests/*.test.mjs
      - name: Dry-run staging-only Worker package (never deploy)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes --package=wrangler@4.156.0 wrangler deploy --dry-run \
            --config telemetry-worker/wrangler.staging.jsonc \
            --outdir /tmp/lan-staging-cooldown-dry-run
      - name: Syntax checks
        run: |
          node --check telemetry-worker/src/index.js
          node --check telemetry-worker/src/security-coordinator.js
          node --check tests/message-puzzle-wrong-answer-cooldown.test.mjs
