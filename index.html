<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/assets/brand/lan-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <!-- Discover the existing Firebase modules before the app import graph completes. -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js" crossorigin>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050b14" />
  <meta name="description" content="Professional portfolio of Rolando Lagmay Jr. — IT, data management, software projects, and creative work." />
  <title>Rolando Lagmay Jr. | Portfolio</title>
  <script>(function(){try{var t=localStorage.getItem("theme")==="light"?"light":"dark";document.documentElement.dataset.theme=t;document.documentElement.dataset.cmsThemeResolved=t;if(t==="light")document.documentElement.classList.add("light");}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <div class="site-loader" id="siteLoader" aria-live="polite"><div class="site-loader-mark">LΛN</div><span data-loader-status>Loading portfolio</span><button class="site-loader-retry" type="button" data-loader-retry hidden>Retry loading</button></div>
  <div id="app"></div>

  <script type="module" src="app.js"></script>
  <script type="module" src="web-analytics-beacon.js"></script>
  <script>
    document.querySelector("[data-loader-retry]")?.addEventListener("click", function () { location.reload(); });
    // A seven-second slow connection is not a startup failure.
    // Keep the existing loader visible without a premature retry prompt.
    setTimeout(function () {
      var loader = document.getElementById('siteLoader');
      if (!loader || loader.classList.contains('is-hidden')) return;
      var status = loader.querySelector('[data-loader-status]');
      if (status) status.textContent = 'Still loading portfolio…';
    }, 7000);
    // Only expose manual recovery after a prolonged stall. A successful render
    // hides the canonical loader; these callbacks then leave it untouched.
    setTimeout(function () {
      var loader = document.getElementById('siteLoader');
      if (!loader || loader.classList.contains('is-hidden')) return;
      var status = loader.querySelector('[data-loader-status]');
      if (status) status.textContent = 'The portfolio is taking longer than expected.';
      var retry = loader.querySelector('[data-loader-retry]');
      if (retry) retry.hidden = false;
    }, 35000);
  </script>
</body>
</html>
